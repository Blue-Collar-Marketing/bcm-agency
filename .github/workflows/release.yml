# Builds and publishes a BCM Agency Tools release when a version tag is pushed.
#
#   git tag v1.3.0 && git push origin v1.3.0
#
# 1. build:   runs the hub tests, checks versions, lints PHP, checks hub keys,
#            builds the zip and info.json (no secrets).
# 2. publish: waits for a second person to approve in the "updates" environment,
#             then copies the files to the public updates repo (GitHub Pages)
#             using a fine-grained token that can only write to that repo.
#
# Sites only see the new version once publish finishes. Rolling it out to sites
# is a separate, deliberate step (Cloudways WP Manager, in waves).

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Hub signature tests
        # Signed-request checks (tampering, replay, wrong host, excluded abilities...).
        # Uses its own throwaway test keys; any failure stops the release here.
        run: php tests/hub/run.php

      - name: Image find and swap tests
        # Classic, Atomic (V4) and background images, including Atomic images stored by id only.
        run: php tests/images/run.php

      - name: Build release
        run: python3 scripts/build_release.py "${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-24.04
    # Required reviewer is set on this environment in repo Settings → Environments.
    # The token below only exists inside this environment, so nothing can
    # publish without that approval.
    environment: updates
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist/

      - name: Publish to the updates site
        env:
          # Fine-grained token limited to the updates repo (Contents: read & write).
          # Stored as an environment secret, so it only exists after approval.
          UPDATES_TOKEN: ${{ secrets.UPDATES_TOKEN }}
          UPDATES_REPO: ${{ vars.UPDATES_REPO }}   # e.g. Blue-Collar-Marketing/bcm-agency-updates
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$UPDATES_TOKEN" || { echo "UPDATES_TOKEN secret is missing in the 'updates' environment (or has expired)"; exit 1; }
          test -n "$UPDATES_REPO"  || { echo "UPDATES_REPO variable is missing"; exit 1; }

          git clone --depth 1 "https://x-access-token:${UPDATES_TOKEN}@github.com/${UPDATES_REPO}.git" site
          mkdir -p site/bcm-agency
          # Keep older zips (handy for rollback); replace info.json so sites see the new version.
          cp dist/bcm-agency/*.zip site/bcm-agency/
          cp dist/bcm-agency/info.json site/bcm-agency/info.json

          cd site
          git config user.name  "BCM Release Bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add bcm-agency
          git commit -m "BCM Agency Tools ${VERSION}" || { echo "Nothing changed"; exit 0; }
          git push origin HEAD

          echo "Published ${VERSION}. Sites will see it within about 12 hours, or immediately with 'Check again' on Dashboard → Updates."
